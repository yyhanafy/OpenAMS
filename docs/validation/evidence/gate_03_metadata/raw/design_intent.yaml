schema_version: 3
circuit_intent:
  topology: two_stage_cmos_operational_amplifier
  device_roles:
    M1: input_transconductance_left
    M2: input_transconductance_right
    M3: diode_connected_active_load
    M4: mirror_active_load
    M5: differential_pair_tail_source
    M6: second_stage_pullup_transconductance
    M7: second_stage_current_sink
  confirmed_patterns:
    differential_pairs:
    - - M1
      - M2
    current_mirrors:
    - - M3
      - M4
    matched_width_groups:
    - - M1
      - M2
    - - M3
      - M4
  current_relations:
  - id: balanced_input_left
    equation: i_m1 = i_m5 / 2.0
  - id: balanced_input_right
    equation: i_m2 = i_m5 / 2.0
  - id: active_load_left
    equation: i_m3 = i_m1
  - id: active_load_right
    equation: i_m4 = i_m2
  - id: output_node_kcl
    equation: i_m6 = i_m7
  size_relations:
  - id: second_stage_size_relation
    equation: s_m6 / s_m4 = 2.0 * s_m7 / s_m5
    fixed_length_equivalent: w_m6 / w_m4 = 2.0 * w_m7 / w_m5
  voltage_relations:
  - id: output_stage_headroom_window
    variable: vout_v
    kind: derived_range
    lower_bound: vss_v + device.M7.vdsat_abs_v
    upper_bound: vdd_v - device.M6.vdsat_abs_v
synthesis_parameterization:
  independent_variables:
    i_m5_a:
      kind: current
      minimum: 1.0e-05
      maximum: 0.0001
      sampling: characterized_current_grid
      role: tail_branch_current
    w_m1_um:
      kind: total_width
      minimum: 1.0
      maximum: 100.0
      sampling: continuous_total_width_with_integer_nf
      role: input_pair_width
      finger_realization:
        enabled: true
        finger_width_min_um: 0.42
        finger_width_max_um: 100.0
        nf_min: 1
        scaling_model: linear_current_scaling
        nf_max: 1
  dependent_quantities:
  - i_m1_a
  - i_m2_a
  - i_m3_a
  - i_m4_a
  - i_m6_a
  - i_m7_a
  - w_m2_um
  - w_m3_um
  - w_m4_um
  - w_m5_um
  - w_m6_um
  - w_m7_um
  - vtail_v
  - n1_v
  - n2_v
  - vbias_v
  - vout_v
  dependent_width_realization:
    total_width_min_um: 0.42
    total_width_max_um: 100.0
    finger_width_min_um: 0.42
    finger_width_max_um: 100.0
    nf_min: 1
    nf_max: 1
    scaling_model: linear_current_scaling
  dependent_ranged_variables:
    vout_v:
      kind: node_voltage_range
      node: out
      role: output_dc_voltage_window
      derivation: rail_headroom_from_device_saturation
      lower_bound:
        rail: vss
        headroom_terms:
        - device: M7
          quantity: vdsat_abs_v
      upper_bound:
        rail: vdd
        headroom_terms:
        - device: M6
          quantity: vdsat_abs_v
      margin_v: 0.0
      intersect_with_specification: true
      declared_bounds:
        minimum: 0.5
        maximum: 1.8
      selection_policy: preserve_feasible_interval
assignment_synthesis:
  strategy: intent_declared_dependency_groups
  groups:
  - id: input_bias_network
    devices:
    - M1
    - M2
    - M3
    - M4
    - M5
    synthesis_variables:
    - i_m5_a
    - w_m1_um
    constraints:
    - balanced_input_left
    - balanced_input_right
    - active_load_left
    - active_load_right
    solver_type: matched_input_network
    solver_config:
      devices:
        input_left: M1
        input_right: M2
        load_diode: M3
        load_mirror: M4
        tail: M5
      variables:
        seed_current: i_m5_a
        seed_width: w_m1_um
        input_left_current: i_m1_a
        input_right_current: i_m2_a
        load_diode_current: i_m3_a
        load_mirror_current: i_m4_a
        input_right_width: w_m2_um
        load_diode_width: w_m3_um
        load_mirror_width: w_m4_um
        tail_width: w_m5_um
        tail_node: vtail_v
        first_internal_node: n1_v
        second_internal_node: n2_v
        bias_node: vbias_v
      branch_current_scale: 0.5
  - id: output_stage
    devices:
    - M6
    - M7
    depends_on:
    - input_bias_network
    synthesis_variables: []
    constraints:
    - output_node_kcl
    - second_stage_size_relation
    - output_stage_headroom_window
    produces_ranged_variables:
    - vout_v
    solver_type: correlated_output_pair
    solver_config:
      devices:
        upper: M6
        lower: M7
      variables:
        upper_gate_node: n2_v
        lower_gate_node: vbias_v
        upper_current: i_m6_a
        lower_current: i_m7_a
        upper_width: w_m6_um
        lower_width: w_m7_um
        output_range: vout_v
        output_min: vout_min_v
        output_max: vout_max_v
      deferred_to_step_5:
      - second_stage_size_relation
      - complete full-circuit assignment validation
  classification:
    fixed_assignments: direct_simulation
    ranged_assignments: extract_optimization_variables_and_build_contract
dependent_derivation_contract:
  semantics: group_ordered_technology_backed_regions
  technology_interpolation: linear_total_width_scaling
  groups:
    input_bias_network:
      derives:
      - i_m1_a
      - i_m2_a
      - i_m3_a
      - i_m4_a
      - w_m2_um
      - w_m3_um
      - w_m4_um
      - w_m5_um
      - vtail_v
      - n1_v
      - n2_v
      - vbias_v
    output_stage:
      depends_on:
      - input_bias_network
      derives:
      - i_m6_a
      - i_m7_a
      - w_m6_um
      - w_m7_um
      - vout_v
      deferred_constraints:
      - output_stage_headroom_window
      - complete_assignment_intersection
      derived_ranges:
        vout_v:
          lower_bound: vss_v + device.M7.vdsat_abs_v
          upper_bound: vdd_v - device.M6.vdsat_abs_v
          intersect_with_specification: true
          selection_policy: preserve_feasible_interval
