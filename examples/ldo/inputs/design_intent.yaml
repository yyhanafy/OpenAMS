schema_version: 3

# LDO topology and node documentation
#
# Nodes:
#   vdd      positive supply rail
#   vss      ground rail
#   vref     reference input at M2 gate
#   vreg     regulated output and feedback input at M1 gate
#   vbias    M5 tail-source gate bias
#   ntail    common source of M1/M2 and drain of M5
#   nmirror  drain of M1 and drain/gate of diode-connected M3;
#            also gate of M4
#   vgate    drain of M2 and M4; error-amplifier output and MP gate
#   ncomp    node between Rfb and Cfb
#
# Functional feedback polarity:
#   vreg < vref -> M2 current rises relative to M1 -> vgate falls
#                -> PMOS MP conducts more -> vreg rises
#   vreg > vref -> vgate rises -> MP conducts less -> vreg falls
#
# Therefore the loop is negative feedback and the nominal DC regulation
# condition is vreg ~= vref.

circuit_intent:
  topology: pmos_pass_ldo_with_cmos_error_amplifier

  device_roles:
    M1: feedback_input_transconductance
    M2: reference_input_transconductance
    M3: diode_connected_active_load
    M4: mirror_active_load
    M5: differential_pair_tail_source
    MP: pmos_pass_device
    Rfb: compensation_series_resistor
    Cfb: compensation_series_capacitor
    Cdec: output_decoupling_capacitor
    IL: dc_output_load

  node_roles:
    vdd: positive_supply
    vss: ground
    vref: regulation_reference
    vreg: regulated_output_and_feedback
    vbias: tail_source_bias
    ntail: differential_pair_common_source
    nmirror: diode_connected_mirror_node
    vgate: error_amplifier_output_and_pass_gate
    ncomp: compensation_internal_node

  confirmed_patterns:
    differential_pairs:
    - - M1
      - M2

    current_mirrors:
    - - M3
      - M4

    matched_width_groups:
    - - M1
      - M2
    - - M3
      - M4

  current_relations:
  - id: differential_pair_tail_kcl
    equation: i_m5 = i_m1 + i_m2

  - id: balanced_regulation_left
    equation: i_m1 = i_m5 / 2.0
    condition: vreg approximately_equal_to vref

  - id: balanced_regulation_right
    equation: i_m2 = i_m5 / 2.0
    condition: vreg approximately_equal_to vref

  - id: active_load_left
    equation: i_m3 = i_m1

  - id: active_load_right
    equation: i_m4 = i_m2

  - id: pass_device_output_kcl
    equation: i_mp = i_load
    condition: dc_steady_state

  voltage_relations:
  - id: regulation_condition
    variable: vreg_v
    kind: feedback_target
    target: vref_v
    relation: approximately_equal

  - id: m1_saturation_headroom
    variable: nmirror_v
    kind: derived_range
    lower_bound: ntail_v + device.M1.vdsat_abs_v
    upper_bound: vdd_v - device.M3.vdsat_abs_v

  - id: error_amplifier_output_headroom
    variable: vgate_v
    kind: derived_range
    lower_bound: ntail_v + device.M2.vdsat_abs_v
    upper_bound: vdd_v - device.M4.vdsat_abs_v

  - id: pass_device_gate_drive
    variable: vgate_v
    kind: technology_backed_relation
    equation: i_mp = f_pmos(w_mp, vdd_v - vgate_v, vdd_v - vreg_v)
    target_current: i_load_a

  - id: dropout_headroom
    variable: dropout_v
    kind: derived_quantity
    equation: dropout_v = vdd_v - vreg_v
    feasibility: MP must supply i_load_a at the resulting vsg and vsd

  dc_component_behavior:
    Rfb:
      dc_role: no_dc_current_path
      reason: series_connected_with_Cfb
    Cfb:
      dc_role: open_circuit
    Cdec:
      dc_role: open_circuit
    IL:
      dc_role: output_current_sink

synthesis_parameterization:
  # Start with the same two error-amplifier seed variables used by the
  # two-stage example.  Load/reference/pass-device choices are treated as
  # externally supplied operating/specification inputs until their sweep
  # ranges are explicitly declared for the LDO experiment.
  independent_variables:
    i_m5_a:
      kind: current
      minimum: 1.0e-05
      maximum: 0.0001
      sampling: characterized_current_grid
      role: tail_branch_current

    w_m1_um:
      kind: total_width
      minimum: 1.0
      maximum: 100.0
      sampling: continuous_total_width_with_integer_nf
      role: input_pair_width
      finger_realization:
        enabled: true
        finger_width_min_um: 0.42
        finger_width_max_um: 100.0
        nf_min: 1
        nf_max: 1
        scaling_model: linear_current_scaling

  external_operating_variables:
    vref_v:
      kind: voltage
      role: regulation_target
      source: simulation_or_specification

    i_load_a:
      kind: current
      role: dc_load_current
      source: simulation_or_specification

    w_mp_um:
      kind: total_width
      role: pass_device_width
      source: synthesis_range_to_be_declared

  dependent_quantities:
  - i_m1_a
  - i_m2_a
  - i_m3_a
  - i_m4_a
  - i_mp_a
  - w_m2_um
  - w_m3_um
  - w_m4_um
  - w_m5_um
  - vtail_v
  - nmirror_v
  - vgate_v
  - vbias_v
  - vreg_v
  - dropout_v

  dependent_width_realization:
    total_width_min_um: 0.42
    total_width_max_um: 100.0
    finger_width_min_um: 0.42
    finger_width_max_um: 100.0
    nf_min: 1
    nf_max: 1
    scaling_model: linear_current_scaling

assignment_synthesis:
  strategy: intent_declared_dependency_groups

  groups:
  - id: error_amplifier
    devices:
    - M1
    - M2
    - M3
    - M4
    - M5

    synthesis_variables:
    - i_m5_a
    - w_m1_um

    constraints:
    - differential_pair_tail_kcl
    - balanced_regulation_left
    - balanced_regulation_right
    - active_load_left
    - active_load_right
    - m1_saturation_headroom
    - error_amplifier_output_headroom

    solver_type: matched_input_network

    solver_config:
      devices:
        feedback_input: M1
        reference_input: M2
        load_diode: M3
        load_mirror: M4
        tail: M5

      variables:
        seed_current: i_m5_a
        seed_width: w_m1_um
        feedback_input_current: i_m1_a
        reference_input_current: i_m2_a
        load_diode_current: i_m3_a
        load_mirror_current: i_m4_a
        feedback_input_width: w_m1_um
        reference_input_width: w_m2_um
        load_diode_width: w_m3_um
        load_mirror_width: w_m4_um
        tail_width: w_m5_um
        tail_node: vtail_v
        mirror_node: nmirror_v
        output_node: vgate_v
        bias_node: vbias_v

      branch_current_scale: 0.5

  - id: pass_stage
    devices:
    - MP

    depends_on:
    - error_amplifier

    synthesis_variables:
    - w_mp_um

    external_variables:
    - vref_v
    - i_load_a

    constraints:
    - regulation_condition
    - pass_device_output_kcl
    - pass_device_gate_drive
    - dropout_headroom

    solver_type: correlated_pass_device

    solver_config:
      devices:
        pass_device: MP

      variables:
        pass_gate_node: vgate_v
        regulated_output: vreg_v
        reference_voltage: vref_v
        pass_current: i_mp_a
        load_current: i_load_a
        pass_width: w_mp_um
        dropout: dropout_v

      dc_target:
        output_voltage: vref_v
        output_current: i_load_a

  - id: compensation_network
    devices:
    - Rfb
    - Cfb
    - Cdec

    depends_on:
    - error_amplifier
    - pass_stage

    synthesis_variables: []

    constraints: []

    solver_type: deferred_ac_transient_network

    solver_config:
      dc_participation: none
      deferred_to:
      - ac_stability
      - load_transient
      - line_transient

  classification:
    fixed_assignments: direct_simulation
    ranged_assignments: extract_optimization_variables_and_build_contract

dependent_derivation_contract:
  semantics: group_ordered_technology_backed_regions
  technology_interpolation: linear_total_width_scaling

  groups:
    error_amplifier:
      derives:
      - i_m1_a
      - i_m2_a
      - i_m3_a
      - i_m4_a
      - w_m2_um
      - w_m3_um
      - w_m4_um
      - w_m5_um
      - vtail_v
      - nmirror_v
      - vgate_v
      - vbias_v

    pass_stage:
      depends_on:
      - error_amplifier

      derives:
      - i_mp_a
      - vreg_v
      - dropout_v

      external_inputs:
      - vref_v
      - i_load_a
      - w_mp_um

      deferred_constraints:
      - complete_assignment_intersection
      - ngspice_dc_regulation_confirmation

    compensation_network:
      depends_on:
      - pass_stage

      derives: []

      deferred_constraints:
      - ac_loop_stability
      - transient_response
