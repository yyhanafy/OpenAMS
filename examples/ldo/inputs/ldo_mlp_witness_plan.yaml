schema_version: 1
name: ldo_balanced_dc_mlp_v1

coverage_csv: examples/ldo/generated/assignment_synthesis/ldo_coverage_plan.csv
output_csv: examples/ldo/generated/witnesses.csv

witnesses_per_point: 5
sat_margin_v: 0.05

mlp:
  nmos_checkpoint: technology/mlp/models/sky130_nmos_mlp.pt
  pmos_checkpoint: technology/mlp/models/sky130_pmos_mlp.pt
  length_um: 0.5

# The witness search below covers the transistor DC operating point only.
# Rfb, Cfb and Cdec are not part of the DC transistor correlation:
# Cfb/Cdec are open at DC and Rfb is isolated by Cfb.
constants:
  vdd: 1.8
  vss: 0.0
  sat_margin_v: 0.05
  current_rel_tol: 0.1
  output_kcl_rel_tol: 0.1
  regulation_tol_v: 0.025

point_bindings:
  w1:
    column: w_m1_um

  i5_target:
    column: i_m5_a

  vref:
    column: vref_v
    default: 0.9

  i_load:
    column: i_load_a
    default: 0.001

  vgate_allowed_lo:
    column: vgate_min_v
    default: 0.001

  vgate_allowed_hi:
    column: vgate_max_v
    default: 1.799

  wmp_allowed_lo:
    column: w_mp_min_um
    default: 0.42

  wmp_allowed_hi:
    column: w_mp_max_um
    default: 100.0

derived_bindings:
  ib: 0.5*i5_target
  vreg: vref

stages:

# 1. Find a valid M1 operating point at the regulated voltage.
- id: m1_feedback_input
  sweeps:
    vtail:
      source: row_interval
      prefix: ntail
      unit: v
      default_lo: 0.0
      default_hi: 0.899
      count: 81

    vx:
      source: row_interval
      prefix: nmirror
      unit: v
      default_lo: 0.001
      default_hi: 1.799
      count: 121

  devices:
  - name: M1
    polarity: nmos
    width: w1
    vgs: vreg-vtail
    vds: vx-vtail
    vbs: vtail-vss

  constraints:
  - M1_domain
  - (vx-vtail)>=M1_vdsat+sat_margin_v
  - relerr(M1_id,ib)<=current_rel_tol

  score: relerr(M1_id,ib)

  outputs:
    vtail: vtail
    vx: vx

  selection_coordinates:
  - vtail
  - vx

  per_parent_keep: 3
  global_cap: 64

  diversity_keys:
  - vtail
  - vx

  selection_mode: all_feasible

# 2. Realize the M5 tail current at the selected tail voltage.
- id: m5_bias
  sweeps:
    vbias:
      source: row_interval
      prefix: vbias
      unit: v
      default_lo: 0.001
      default_hi: 1.799
      count: 161

    w5:
      source: model_width_interval
      polarity: nmos
      row_interval:
        prefix: w_m5
        unit: um
        default_lo: 0.42
        default_hi: 100.0
      count: 160
      spacing: geom

  devices:
  - name: M5
    polarity: nmos
    width: w5
    vgs: vbias-vss
    vds: vtail-vss
    vbs: '0.0'

  constraints:
  - M5_domain
  - (vtail-vss)>=M5_vdsat+sat_margin_v
  - relerr(M5_id,i5_target)<=current_rel_tol

  score: relerr(M5_id,i5_target)

  outputs:
    vbias: vbias
    w5: w5

  selection_coordinates:
  - vbias
  - w5

  per_parent_keep: 3
  global_cap: 64

  diversity_keys:
  - vtail
  - vx
  - vbias
  - w5

# 3. Realize the diode-connected PMOS mirror device M3.
- id: m3_mirror_reference
  sweeps:
    w3:
      source: model_width_interval
      polarity: pmos
      row_interval:
        prefix: w_m3
        unit: um
        default_lo: 0.42
        default_hi: 100.0
      count: 160
      spacing: geom

  devices:
  - name: M3
    polarity: pmos
    width: w3
    vgs: vdd-vx
    vds: vdd-vx
    vbs: '0.0'

  constraints:
  - M3_domain
  - (vdd-vx)>=M3_vdsat+sat_margin_v
  - relerr(M3_id,ib)<=current_rel_tol

  score: relerr(M3_id,ib)

  outputs:
    w3: w3

  selection_coordinates:
  - w3

  per_parent_keep: 3
  global_cap: 64

  diversity_keys:
  - vtail
  - vx
  - vbias
  - w3

# 4. Solve the other differential branch and error-amplifier output node.
#    Unlike the two-stage op-amp witness plan, vgate is NOT forced equal to
#    nmirror.  It is swept because it must simultaneously satisfy M2/M4 KCL
#    and later provide the gate drive required by the PMOS pass device.
- id: balanced_m2_m4
  sweeps:
    vgate:
      source: row_interval
      prefix: vgate
      unit: v
      default_lo: 0.001
      default_hi: 1.799
      count: 161

  devices:
  - name: M2
    polarity: nmos
    width: w1
    vgs: vref-vtail
    vds: vgate-vtail
    vbs: vtail-vss

  - name: M4
    polarity: pmos
    width: w3
    vgs: vdd-vx
    vds: vdd-vgate
    vbs: '0.0'

  constraints:
  - M2_domain & M4_domain
  - (vgate>=vgate_allowed_lo) & (vgate<=vgate_allowed_hi)
  - (vgate-vtail)>=M2_vdsat+sat_margin_v
  - (vdd-vgate)>=M4_vdsat+sat_margin_v
  - relerr(M2_id,ib)<=current_rel_tol
  - relerr(M4_id,ib)<=current_rel_tol
  - relerr(M2_id,M4_id)<=current_rel_tol

  score: max(relerr(M2_id,ib),relerr(M4_id,ib),relerr(M2_id,M4_id))

  outputs:
    vgate: vgate

  selection_coordinates:
  - vgate

  per_parent_keep: 3
  global_cap: 64

  diversity_keys:
  - vtail
  - vx
  - vbias
  - w3
  - w5
  - vgate

# 5. At DC regulation vreg=vref.  Find a PMOS pass width that supplies
#    the requested load current at the vgate generated by the error amplifier.
- id: pass_device
  sweeps:
    wmp:
      source: model_width_interval
      polarity: pmos
      row_interval:
        prefix: w_mp
        unit: um
        default_lo: 0.42
        default_hi: 100.0
      count: 160
      spacing: geom

  devices:
  - name: MP
    polarity: pmos
    width: wmp
    vgs: vdd-vgate
    vds: vdd-vreg
    vbs: '0.0'

  constraints:
  - MP_domain
  - (wmp>=wmp_allowed_lo) & (wmp<=wmp_allowed_hi)
  - relerr(MP_id,i_load)<=output_kcl_rel_tol

  score: relerr(MP_id,i_load)

  outputs:
    wmp: wmp
    vreg: vreg

  selection_coordinates:
  - wmp
  - vgate

  per_parent_keep: 3
  global_cap: 0

final:
  devices:
  - name: M1
    polarity: nmos
    width: w1
    vgs: vreg-vtail
    vds: vx-vtail
    vbs: vtail-vss

  - name: M2
    polarity: nmos
    width: w1
    vgs: vref-vtail
    vds: vgate-vtail
    vbs: vtail-vss

  - name: M3
    polarity: pmos
    width: w3
    vgs: vdd-vx
    vds: vdd-vx
    vbs: '0.0'

  - name: M4
    polarity: pmos
    width: w3
    vgs: vdd-vx
    vds: vdd-vgate
    vbs: '0.0'

  - name: M5
    polarity: nmos
    width: w5
    vgs: vbias-vss
    vds: vtail-vss
    vbs: '0.0'

  - name: MP
    polarity: pmos
    width: wmp
    vgs: vdd-vgate
    vds: vdd-vreg
    vbs: '0.0'

  residuals:
    tail_kcl: (M5_id-M1_id-M2_id)/max(max(abs(M5_id),abs(M1_id+M2_id)),1e-12)
    mirror_left: (M3_id-M1_id)/max(max(abs(M3_id),abs(M1_id)),1e-12)
    error_output_kcl: (M4_id-M2_id)/max(max(abs(M4_id),abs(M2_id)),1e-12)
    mirror_balance: (M3_id-M4_id)/max(max(abs(M3_id),abs(M4_id)),1e-12)
    output_kcl: (MP_id-i_load)/max(max(abs(MP_id),abs(i_load)),1e-12)
    i5_target: (M5_id-i5_target)/max(max(abs(M5_id),abs(i5_target)),1e-12)
    regulation_error: (vreg-vref)/max(max(abs(vref),1.0),1e-12)

  saturation_headroom:
    M1: (vx-vtail)-M1_vdsat
    M2: (vgate-vtail)-M2_vdsat
    M3: (vdd-vx)-M3_vdsat
    M4: (vdd-vgate)-M4_vdsat
    M5: (vtail-vss)-M5_vdsat

  constraints:
  - M1_domain & M2_domain & M3_domain & M4_domain & M5_domain & MP_domain
  - ((vx-vtail)-M1_vdsat)>=sat_margin_v
  - ((vgate-vtail)-M2_vdsat)>=sat_margin_v
  - ((vdd-vx)-M3_vdsat)>=sat_margin_v
  - ((vdd-vgate)-M4_vdsat)>=sat_margin_v
  - ((vtail-vss)-M5_vdsat)>=sat_margin_v
  - abs(vreg-vref)<=regulation_tol_v
  - relerr(MP_id,i_load)<=output_kcl_rel_tol

csv_aliases:
  w_m1_um: w1
  i_m5_target_a: i5_target
  i_half_target_a: ib
  vref_v: vref
  vreg_v: vreg
  vbias_v: vbias
  vtail_v: vtail
  nmirror_v: vx
  vgate_v: vgate
  w_m3_um: w3
  w_m5_um: w5
  w_mp_um: wmp
  i_load_a: i_load
