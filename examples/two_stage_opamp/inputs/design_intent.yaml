schema_version: 3
circuit_intent:
  topology: two_stage_cmos_operational_amplifier
  device_roles:
    M1: input_transconductance_left
    M2: input_transconductance_right
    M3: diode_connected_active_load
    M4: mirror_active_load
    M5: differential_pair_tail_source
    M6: second_stage_pullup_transconductance
    M7: second_stage_current_sink
  confirmed_patterns:
    differential_pairs:
    - - M1
      - M2
    current_mirrors:
    - - M3
      - M4
    matched_width_groups:
    - - M1
      - M2
    - - M3
      - M4
  current_relations:
  - id: balanced_input_left
    equation: i_m1 = i_m5 / 2.0
  - id: balanced_input_right
    equation: i_m2 = i_m5 / 2.0
  - id: active_load_left
    equation: i_m3 = i_m1
  - id: active_load_right
    equation: i_m4 = i_m2
  - id: output_node_kcl
    equation: i_m6 = i_m7
  size_relations:
  - id: second_stage_size_relation
    equation: s_m6 / s_m4 = 2.0 * s_m7 / s_m5
    fixed_length_equivalent: w_m6 / w_m4 = 2.0 * w_m7 / w_m5
  voltage_relations:
  - id: output_stage_headroom_window
    variable: vout_v
    kind: derived_range
    lower_bound: vss_v + device.M7.vdsat_abs_v
    upper_bound: vdd_v - device.M6.vdsat_abs_v
synthesis_parameterization:
  independent_variables:
    i_m5_a:
      kind: current
      minimum: 1.0e-05
      maximum: 0.0001
      sampling: characterized_current_grid
      role: tail_branch_current
    w_m1_um:
      kind: total_width
      minimum: 1.0
      maximum: 100.0
      sampling: continuous_total_width_with_integer_nf
      role: input_pair_width
      finger_realization:
        enabled: true
        finger_width_min_um: 0.42
        finger_width_max_um: 100.0
        nf_min: 1
        scaling_model: linear_current_scaling
        nf_max: 1
  dependent_quantities:
  - i_m1_a
  - i_m2_a
  - i_m3_a
  - i_m4_a
  - i_m6_a
  - i_m7_a
  - w_m2_um
  - w_m3_um
  - w_m4_um
  - w_m5_um
  - w_m6_um
  - w_m7_um
  - vtail_v
  - n1_v
  - n2_v
  - vbias_v
  - vout_v
  dependent_width_realization:
    total_width_min_um: 0.42
    total_width_max_um: 100.0
    finger_width_min_um: 0.42
    finger_width_max_um: 100.0
    nf_min: 1
    nf_max: 1
    scaling_model: linear_current_scaling
  dependent_ranged_variables:
    vout_v:
      kind: node_voltage_range
      node: out
      role: output_dc_voltage_window
      derivation: rail_headroom_from_device_saturation
      lower_bound:
        rail: vss
        headroom_terms:
        - device: M7
          quantity: vdsat_abs_v
      upper_bound:
        rail: vdd
        headroom_terms:
        - device: M6
          quantity: vdsat_abs_v
      margin_v: 0.0
      intersect_with_specification: true
      declared_bounds:
        minimum: 0.5
        maximum: 1.8
      selection_policy: preserve_feasible_interval
assignment_synthesis:
  strategy: intent_declared_dependency_groups
  groups:
  - id: input_bias_network
    devices:
    - M1
    - M2
    - M3
    - M4
    - M5
    synthesis_variables:
    - i_m5_a
    - w_m1_um
    constraints:
    - balanced_input_left
    - balanced_input_right
    - active_load_left
    - active_load_right
    solver_type: matched_input_network
    solver_config:
      devices:
        input_left: M1
        input_right: M2
        load_diode: M3
        load_mirror: M4
        tail: M5
      variables:
        seed_current: i_m5_a
        seed_width: w_m1_um
        input_left_current: i_m1_a
        input_right_current: i_m2_a
        load_diode_current: i_m3_a
        load_mirror_current: i_m4_a
        input_right_width: w_m2_um
        load_diode_width: w_m3_um
        load_mirror_width: w_m4_um
        tail_width: w_m5_um
        tail_node: vtail_v
        first_internal_node: n1_v
        second_internal_node: n2_v
        bias_node: vbias_v
      branch_current_scale: 0.5
  - id: output_stage
    devices:
    - M6
    - M7
    depends_on:
    - input_bias_network
    synthesis_variables: []
    constraints:
    - output_node_kcl
    - second_stage_size_relation
    - output_stage_headroom_window
    produces_ranged_variables:
    - vout_v
    solver_type: correlated_output_pair
    solver_config:
      devices:
        upper: M6
        lower: M7
      variables:
        upper_gate_node: n2_v
        lower_gate_node: vbias_v
        upper_current: i_m6_a
        lower_current: i_m7_a
        upper_width: w_m6_um
        lower_width: w_m7_um
        output_range: vout_v
        output_min: vout_min_v
        output_max: vout_max_v
      deferred_to_step_5:
      - second_stage_size_relation
      - complete full-circuit assignment validation
  classification:
    fixed_assignments: direct_simulation
    ranged_assignments: extract_optimization_variables_and_build_contract
dependent_derivation_contract:
  semantics: group_ordered_technology_backed_regions
  technology_interpolation: linear_total_width_scaling
  groups:
    input_bias_network:
      derives:
      - i_m1_a
      - i_m2_a
      - i_m3_a
      - i_m4_a
      - w_m2_um
      - w_m3_um
      - w_m4_um
      - w_m5_um
      - vtail_v
      - n1_v
      - n2_v
      - vbias_v
    output_stage:
      depends_on:
      - input_bias_network
      derives:
      - i_m6_a
      - i_m7_a
      - w_m6_um
      - w_m7_um
      - vout_v
      deferred_constraints:
      - output_stage_headroom_window
      - complete_assignment_intersection
      derived_ranges:
        vout_v:
          lower_bound: vss_v + device.M7.vdsat_abs_v
          upper_bound: vdd_v - device.M6.vdsat_abs_v
          intersect_with_specification: true
          selection_policy: preserve_feasible_interval
hierarchical_feasibility:
  schema_version: 2
  strategy: hierarchical_component_mlp_exact_realization
  independent_point_source:
    kind: independent_regions_json
    path: examples/two_stage_opamp/generated/assignment_synthesis/independent_regions.json
    variables:
      w_m1_um:
        domain: w_m1_um
        sampling: linear_from_domain
        count: 25
      i_m5_a:
        domain: i_m5_a
        sampling: candidate_values
  components:
  - id: input_bias_network
    source_group: input_bias_network
    checkpoint: technology/component_models/two_stage_input_bias_network_v3.pt
    model_kind: feasibility_range_emitter
    mlp_features:
    - w_m1_um
    - i_m5_a
    - vy_v
    - vbias_v
    interface_inputs: []
    interface_outputs:
    - first_second_stage_cut
    emitted_ranges:
    - name: stage_ratio
      low_output: log_r_min
      high_output: log_r_max
      transform: exp
    exact_realizer:
      driver: witness_plan_builder
      module: tools/validation/run_two_stage_independent_tables_v2.py
      builder_function: build_a_plan
      base_plan: examples/two_stage_opamp/inputs/two_stage_mlp_witness_plan.yaml
      witnesses_per_state: 5
    derived_after_realization:
    - name: stage_ratio
      expression: 2.0 * w_m3_um / w_m5_um
    training:
      feature_domains:
        w_m1_um:
          count: 7
          spacing: log
        i_m5_a:
          count: 7
          spacing: log
  - id: output_stage
    source_group: output_stage
    depends_on:
    - input_bias_network
    checkpoint: technology/component_models/two_stage_output_stage_fullR.pt
    model_kind: binary_feasibility_classifier
    mlp_features:
    - vout_v
    - vy_v
    - vbias_v
    - stage_ratio
    interface_inputs:
    - first_second_stage_cut
    interface_outputs: []
    local_search_coordinates:
    - name: vout_v
      kind: voltage
      grid:
        minimum: 0.5
        maximum: 1.6
        count: 12
        spacing: linear
    exact_realizer:
      driver: witness_plan_builder
      module: tools/validation/run_two_stage_independent_tables_v2.py
      builder_function: build_b_plan
      base_plan: examples/two_stage_opamp/inputs/two_stage_mlp_witness_plan.yaml
      witnesses_per_state: 3
      coverage_bindings:
        a_point_index: source_point_index
        a_witness_rank: source_witness_rank
    training:
      coverage_bindings:
        a_point_index: point_index
        a_witness_rank: 0
        i_m5_a: 1.0009030134e-05
        w_m3_um: 0.5 * stage_ratio
        w_m5_um: 1.0
  interfaces:
  - id: first_second_stage_cut
    between:
    - input_bias_network
    - output_stage
    coordinates:
    - name: vy_v
      kind: voltage
      physical_nodes:
      - n2
      relation: shared_equal_coordinate
      grid:
        minimum: 0.15
        maximum: 1.65
        count: 61
        spacing: linear
    - name: vbias_v
      kind: voltage
      physical_nodes:
      - vbias
      relation: shared_equal_coordinate
      grid:
        minimum: 0.55
        maximum: 1.05
        count: 9
        spacing: linear
    propagated_variables:
    - name: stage_ratio
      source_component: input_bias_network
      destination_component: output_stage
      semantics: exact_value_after_realization
      training_domain:
        minimum: 0.04
        maximum: 200.0
        count: 21
        spacing: log
  final_witness:
    semantics: complete_spice_realizable_assignment
    deduplicate_on:
    - w_m1_um
    - w_m2_um
    - w_m3_um
    - w_m4_um
    - w_m5_um
    - w_m6_um
    - w_m7_um
    - vbias_v
    - vout_v
    canonical_fields:
      w_m1_um: A_w_m1_um
      w_m2_um: A_w_m1_um
      w_m3_um: A_w_m3_um
      w_m4_um: A_w_m3_um
      w_m5_um: A_w_m5_um
      w_m6_um: B_w_m6_um
      w_m7_um: B_w_m7_um
      i_m1_a: A_id_m1_a
      i_m2_a: A_id_m2_a
      i_m3_a: A_id_m3_a
      i_m4_a: A_id_m4_a
      i_m5_a: A_id_m5_a
      i_m6_a: B_id_m6_a
      i_m7_a: B_id_m7_a
      vtail_v: A_vtail_v
      n1_v: A_vx_v
      n2_v: A_vy_v
      vbias_v: A_vbias_v
      vout_v: B_vout_v
      stage_ratio: B_stage_ratio
      sat_M1_headroom_v: A_sat_M1_headroom_v
      sat_M2_headroom_v: A_sat_M2_headroom_v
      sat_M3_headroom_v: A_sat_M3_headroom_v
      sat_M4_headroom_v: A_sat_M4_headroom_v
      sat_M5_headroom_v: A_sat_M5_headroom_v
      sat_M6_headroom_v: B_sat_M6_headroom_v
      sat_M7_headroom_v: B_sat_M7_headroom_v
pre_spice_metrics:
  schema_version: 1
  technology:
    length_um: 0.15
    neighbors: 8
    nmos_model_contains: nfet
    pmos_model_contains: pfet
  constants:
    vdd: 1.8
    vss: 0.0
    vicm: 0.9
    cc_f: 2.0e-12
    cl_f: 1.0e-11
  devices:
    M1:
      polarity: nmos
      width: w_m1_um
      vgs: abs(vicm-vtail_v)
      vds: abs(n1_v-vtail_v)
      vbs: abs(vss-vtail_v)
    M2:
      polarity: nmos
      width: w_m2_um
      vgs: abs(vicm-vtail_v)
      vds: abs(n2_v-vtail_v)
      vbs: abs(vss-vtail_v)
    M3:
      polarity: pmos
      width: w_m3_um
      vgs: abs(vdd-n1_v)
      vds: abs(vdd-n1_v)
      vbs: '0'
    M4:
      polarity: pmos
      width: w_m4_um
      vgs: abs(vdd-n1_v)
      vds: abs(vdd-n2_v)
      vbs: '0'
    M5:
      polarity: nmos
      width: w_m5_um
      vgs: abs(vbias_v-vss)
      vds: abs(vtail_v-vss)
      vbs: '0'
    M6:
      polarity: pmos
      width: w_m6_um
      vgs: abs(vdd-n2_v)
      vds: abs(vdd-vout_v)
      vbs: '0'
    M7:
      polarity: nmos
      width: w_m7_um
      vgs: abs(vbias_v-vss)
      vds: abs(vout_v-vss)
      vbs: '0'
  metrics:
  - name: est_stage1_rout_ohm
    expression: parallel(M2.ro, M4.ro)
  - name: est_stage1_gain_vv
    expression: M1.gm * est_stage1_rout_ohm
  - name: est_stage2_rout_ohm
    expression: parallel(M6.ro, M7.ro)
  - name: est_stage2_gain_vv
    expression: M6.gm * est_stage2_rout_ohm
  - name: est_gain_vv
    expression: est_stage1_gain_vv * est_stage2_gain_vv
  - name: est_gain_db
    expression: db20(est_gain_vv)
  - name: est_ugb_hz
    expression: M1.gm / (2*pi*cc_f)
  - name: est_idd_a
    expression: abs(i_m3_a) + abs(i_m4_a) + abs(i_m6_a)
  - name: est_power_w
    expression: vdd * est_idd_a
  ranks:
  - name: rank_est_gain
    source: est_gain_db
    ascending: false
  - name: rank_est_ugb
    source: est_ugb_hz
    ascending: false
  - name: rank_low_power
    source: est_power_w
    ascending: true
  - name: rank_low_area
    source: est_gate_area_um2
    ascending: true
  - name: rank_low_tech_distance
    source: est_tech_distance_max_v
    ascending: true
