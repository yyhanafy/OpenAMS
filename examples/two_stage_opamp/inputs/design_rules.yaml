schema_version: 3
operating_conditions:
  vdd_v: 1.8
  vss_v: 0.0
  vin_cm_v: 0.9
  c_miller_f: 3.0e-12
  c_load_f: 1.0e-11
device_constraints:
  all_mos:
    required_region: saturation
    length_um: 0.15
    width_min_um: 0.42
    width_max_um: 100.0
    body_voltage_abs_max_v: 1.0e-09
technology_intersection:
  require_saturated: true
  current_relative_tolerance: 0.1
  current_absolute_tolerance_a: 1.0e-06
  node_voltage_tolerance_v: 0.025
  diode_voltage_tolerance_v: 0.025
  electrical_voltage_match_tolerance_v: 1.0e-09
  width_relation_relative_tolerance: 1.0e-08
  max_assignments: 100000
assignment_rules:
  assignment_semantics: complete_correlated_circuit_assignment
  representation: normalized_point_cloud
  cartesian_product_allowed: false
  ranged_variable_semantics: preserve_feasible_interval
  dependent_range_cartesian_expansion_allowed: false
simulation_constraints:
  dc_convergence_required: true
  enforce_device_regions: true
  enforce_output_window_from_specs: true
active_technology_source: sky130_laygo2_tt_27c
technology_sources:
  sky130_laygo2_tt_27c:
    provider: mos_inverse_table
    source: ../../../technology/sky130_tt_27c_mos_characterization.csv
    corner: tt
    temperature_c: 27.0
    models:
      nmos: sky130_fd_pr__nfet_01v8_lvt
      pmos: sky130_fd_pr__pfet_01v8
derived_node_domains:
  vout_v:
    node: out
    kind: dependent_ranged_variable
    lower_bound:
      rail: vss_v
      headroom_terms:
      - device: M7
        quantity: vdsat_abs_v
    upper_bound:
      rail: vdd_v
      headroom_terms:
      - device: M6
        quantity: vdsat_abs_v
    margin_v: 0.0
    intersect_with_specification: true
    require_nonempty_interval: true
