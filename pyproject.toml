[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openams-clean-witness"
version = "0.1.0"
description = "Topology-generic correlated MLP witness generation and ngspice verification"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "PyYAML",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
